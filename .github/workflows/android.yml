name: Build Android debug APK
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and lint the debug app
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verify and name the installable APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" "$RUNNER_TEMP/LumaPlay-debug.apk"
          sha256sum "$RUNNER_TEMP/LumaPlay-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LumaPlay-debug
          path: ${{ runner.temp }}/LumaPlay-debug.apk
          if-no-files-found: error
